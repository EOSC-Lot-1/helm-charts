{{/* vim: set syntax=helm: */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rsyslog.fullname" . }}
  labels:
    {{- include "rsyslog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 514
    targetPort: 514
    protocol: TCP
    name: syslog
  - port: 6514
    targetPort: 6514
    protocol: TCP
    name: syslog-gtls
  selector:
    {{- include "rsyslog.selectorLabels" . | nindent 4 }}
